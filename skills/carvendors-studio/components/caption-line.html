<!doctype html>
<!--
  caption-line  (CarVendors accessible voiceover captions, 1080x1920)

  Purpose: readable, calm captions. Manrope 700 white, max 2 lines, balanced line breaks, one semantic chunk
  at a time, each chunk on a subtle rounded charcoal backing (~55 %) that hugs the text. No karaoke colours,
  no word pops. Mount ONE instance per video as the caption track, spanning the voiceover.

  Variables (host data-variable-values):
    chunks   string   JSON array, times in s relative to the host start (same format as glass caption-line):
                        [{"s":0.25,"e":1.4,"w":[["Small",0.25],["car,",0.5],...]}, {"s":1.5,"e":2.6,"text":"..."}]
                      "w" = [word, startTime] (only the words are used here), or give "text".
                      mount.py --words <tts .words.json> [--words-offset S] builds this for you.
    x        number   anchor x px (left edge / centre / right edge by align)       540
    bottom   number   y of the backing's bottom edge px (keep <= 1500)             1480
    maxW     number   max backing width px                                         820
    size     number   font px (46-52)                                              48
    align    enum     left | center | right                                        "center"
    backing  number   backing opacity 0-0.7 (0 = no backing, shadow only)          0.55

  Timing per chunk: in at s with a 6 px rise + opacity, 160 ms power3.out; out with a 100 ms fade that ends at e.
  Chunks should not overlap; leave >= 0.05 s between e and the next s.

  Mount:
    python3 ~/.claude/skills/carvendors-studio/tools/mount.py add . caption-line captions --start 0 --dur 12 \
      --track 9 --vars-file caps.json
    python3 ~/.claude/skills/carvendors-studio/tools/mount.py add . caption-line captions --start 0 --dur 30 \
      --track 9 --words voice/s01.words.json
  Needs assets/fonts/Manrope-Bold.ttf.
-->
<html
  data-composition-variables='[
    {"id":"chunks","type":"string","label":"Chunks (JSON)","default":"[{\"s\":0.2,\"e\":1.6,\"text\":\"Caption line goes here\"}]"},
    {"id":"x","type":"number","label":"Anchor x (px)","default":540,"min":0,"max":1080},
    {"id":"bottom","type":"number","label":"Bottom (px)","default":1480,"min":200,"max":1900},
    {"id":"maxW","type":"number","label":"Max width (px)","default":820,"min":200,"max":1000},
    {"id":"size","type":"number","label":"Size (px)","default":48,"min":30,"max":72},
    {"id":"align","type":"enum","label":"Align","default":"center","options":[{"value":"left","label":"Left"},{"value":"center","label":"Centre"},{"value":"right","label":"Right"}]},
    {"id":"backing","type":"number","label":"Backing opacity","default":0.55,"min":0,"max":0.7,"step":0.01}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Manrope"; src: url("../assets/fonts/Manrope-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; }
        #__ID__ { position: absolute; inset: 0; pointer-events: none; }
        #__ID__ .cl-chunk {
          position: absolute; left: 540px; bottom: 440px; box-sizing: border-box;
          padding: 10px 18px 11px; border-radius: 12px; background: rgb(17 19 17 / 0.55);
          font-family: "Manrope", sans-serif; font-weight: 700; font-size: 48px; line-height: 1.22; letter-spacing: -0.006em;
          color: #fff; text-align: center; white-space: nowrap; opacity: 0;
        }
        #__ID__ .cl-chunk.no-back { text-shadow: 0 1px 2px rgb(0 0 0 / 0.5), 0 2px 12px rgb(0 0 0 / 0.35); }
      </style>
      <div id="__ID__" data-composition-id="__ID__" data-width="1080" data-height="1920"></div>
      <script>
        (function () {
          const ID = "__ID__", D = __DUR__;
          const DEF = { chunks: '[{"s":0.2,"e":1.6,"text":"Caption line goes here"}]', x: 540, bottom: 1480, maxW: 820, size: 48, align: "center", backing: 0.55 };
          let v = {};
          try { v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {}; } catch (e) {}
          const P = Object.assign({}, DEF, v);
          let chunks = [];
          try { chunks = typeof P.chunks === "string" ? JSON.parse(P.chunks) : P.chunks; } catch (e) { chunks = []; }
          const root = document.getElementById(ID);
          const al = ["left", "center", "right"].includes(P.align) ? P.align : "center";
          const back = Math.max(0, Math.min(0.7, Number(P.backing)));
          const els = chunks.map((c) => {
            const text = c.w ? c.w.map((w) => w[0]).join(" ") : String(c.text || "");
            const el = document.createElement("div");
            el.className = "cl-chunk" + (back > 0 ? "" : " no-back");
            el.textContent = text.replace(/\s+/g, " ").trim();
            Object.assign(el.style, { fontSize: P.size + "px", maxWidth: P.maxW + "px", textAlign: al, background: back > 0 ? "rgb(17 19 17 / " + back + ")" : "none" });
            root.appendChild(el);
            return { el, s: Number(c.s), e: Math.min(Number(c.e), D) };
          });
          // Line breaks come from canvas text metrics, not layout: the caption clip is display:none
          // when this runs, so offsetWidth would be 0. Max 2 lines, balanced; shrinks the font if needed.
          const cv = document.createElement("canvas").getContext("2d");
          const PADX = 18;
          function layout(text, fs) {
            cv.font = "700 " + fs + "px Manrope";
            cv.letterSpacing = (-0.006 * fs).toFixed(2) + "px";
            const W = (t) => cv.measureText(t).width;
            const words = text.split(" ");
            const avail = P.maxW - 2 * PADX;
            if (W(text) <= avail || words.length < 2) return { lines: [text], w: W(text) };
            let best = null;
            for (let i = 1; i < words.length; i++) {
              const l1 = words.slice(0, i).join(" "), l2 = words.slice(i).join(" ");
              const m = Math.max(W(l1), W(l2));
              if (!best || m < best.w) best = { lines: [l1, l2], w: m };
            }
            return best;
          }
          function build() {
            const tl = gsap.timeline({ paused: true });
            els.forEach(({ el, s, e }) => {
              const text = el.textContent;
              let fs = Number(P.size), L = layout(text, fs);
              while (L.w > P.maxW - 2 * PADX && fs > 30) { fs -= 2; L = layout(text, fs); }
              el.textContent = "";
              el.style.fontSize = fs + "px";
              L.lines.forEach((t) => { const d = document.createElement("div"); d.textContent = t; el.appendChild(d); });
              el.style.width = Math.ceil(L.w + 2 * PADX + 2) + "px";
              el.style.left = P.x + "px";
              el.style.top = "auto";
              el.style.bottom = 1920 - P.bottom + "px";
              gsap.set(el, { xPercent: al === "left" ? 0 : al === "right" ? -100 : -50 });
              tl.fromTo(el, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.16, ease: "power3.out" }, s);
              tl.to(el, { opacity: 0, duration: 0.1, ease: "power1.in" }, Math.max(s + 0.2, e - 0.1));
            });
            window.__timelines[ID] = tl;
            if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
          }
          document.fonts.load("700 " + P.size + "px Manrope", "Aa").then(build, build);
        })();
      </script>
    </template>
  </body>
</html>
