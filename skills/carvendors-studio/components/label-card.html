<!doctype html>
<!--
  label-card  (reference style: white card "Abarth 595 / Small Car. Big Personality." with a red tag on top)

  Purpose: a premium model label on a clean white card — heavy charcoal title, one short subtitle, optional
  small coloured tag sitting on the card's top-left edge. Great for the first main shot (model name) or as the
  cover for old text (place it over the old text box). Optional small tick lines under it (max 2, verified only).
  The tag text must be true (no "NEW ARRIVAL" / "SOLD" unless verified) — e.g. "FEATURED", "AT B&F CARS".

  Variables (host data-variable-values):
    title     string   big line                                                   "Abarth 595"
    sub       string   subtitle ("" = none)                                       "Small car. Big personality."
    tag       string   small tag above the card ("" = none)                       ""
    tagColor  color    tag colour                                                 "#E8202A"
    x, y      number   card top-left (align left) / top-centre (align center)     70, 360
    align     enum     left | center                                              "left"
    size      number   title px                                                   84
    tilt      number   rotation deg (-4..0)                                       -2
    ticks     string   up to 2 lines separated by "|", shown with green ticks under the card ("" = none)  ""
    delay     number   entrance start s                                           0.1
    exit      boolean  fade out at the end of the slot                            true

  Timing: card rises 18 px + fades (280 ms, expo.out); tag pops in +120 ms (scale 0.6→1, back.out(1.6) 240 ms);
  ticks stagger 90 ms. Exit 180 ms.
    python3 ~/.claude/skills/carvendors-studio/tools/mount.py add . label-card lc1 --start 0.2 --dur 3 --track 7 \
      --vars '{"title":"Abarth 595","sub":"Small car. Big personality.","tag":"AT B&F CARS"}'
-->
<html
  data-composition-variables='[
    {"id":"title","type":"string","label":"Title","default":"Abarth 595"},
    {"id":"sub","type":"string","label":"Subtitle","default":"Small car. Big personality."},
    {"id":"tag","type":"string","label":"Tag","default":""},
    {"id":"tagColor","type":"color","label":"Tag colour","default":"#E8202A"},
    {"id":"x","type":"number","label":"x","default":70,"min":0,"max":1080},
    {"id":"y","type":"number","label":"y","default":360,"min":0,"max":1920},
    {"id":"align","type":"enum","label":"Align","default":"left","options":[{"value":"left","label":"Left"},{"value":"center","label":"Centre"}]},
    {"id":"size","type":"number","label":"Title size","default":84,"min":40,"max":140},
    {"id":"tilt","type":"number","label":"Tilt","default":-2,"min":-6,"max":2,"step":0.5},
    {"id":"ticks","type":"string","label":"Ticks (|)","default":""},
    {"id":"delay","type":"number","label":"Delay","default":0.1,"min":0,"max":5,"step":0.05},
    {"id":"exit","type":"boolean","label":"Exit","default":true}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Montserrat"; src: url("../assets/fonts/Montserrat-Black.ttf") format("truetype"); font-weight: 900; font-style: normal; }
        @font-face { font-family: "Montserrat"; src: url("../assets/fonts/Montserrat-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; }
        @font-face { font-family: "Montserrat"; src: url("../assets/fonts/Montserrat-ExtraBold.ttf") format("truetype"); font-weight: 800; font-style: normal; }
        #__ID__ { position: absolute; inset: 0; pointer-events: none; }
        #__ID__ .lc { position: absolute; font-family: "Montserrat", sans-serif; }
        #__ID__ .lc-card { position: relative; background: #fff; border-radius: 22px; padding: 26px 34px 24px;
          box-shadow: 0 14px 36px rgb(0 0 0 / 0.28), 0 2px 6px rgb(0 0 0 / 0.12); }
        #__ID__ .lc-tag { position: absolute; left: 22px; top: -24px; color: #fff;
          font-weight: 800; font-size: 26px; letter-spacing: 0.04em; padding: 8px 16px 9px; border-radius: 10px;
          box-shadow: 0 6px 14px rgb(0 0 0 / 0.25); white-space: nowrap; }
        #__ID__ .lc-t { font-weight: 900; color: #111311; line-height: 1; letter-spacing: -0.02em; white-space: nowrap; }
        #__ID__ .lc-s { font-weight: 700; color: #111311; margin-top: 10px; white-space: nowrap; }
        #__ID__ .lc-ticks { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
        #__ID__ .lc-tk { display: flex; align-items: center; gap: 14px; color: #fff; font-weight: 800; font-size: 34px;
          text-shadow: 0 2px 10px rgb(0 0 0 / 0.45); white-space: nowrap; }
        #__ID__ .lc-tk i { width: 36px; height: 36px; border-radius: 50%; background: #2DB84B; flex: none; display: grid; place-items: center;
          box-shadow: 0 3px 8px rgb(0 0 0 / 0.3); }
      </style>
      <div id="__ID__" data-composition-id="__ID__" data-width="1080" data-height="1920">
        <div class="lc"><div class="lc-card"><div class="lc-tag"></div><div class="lc-t"></div><div class="lc-s"></div></div><div class="lc-ticks"></div></div>
      </div>
      <script>
        (function () {
          const ID = "__ID__", D = __DUR__;
          const DEF = { title: "Abarth 595", sub: "Small car. Big personality.", tag: "", tagColor: "#E8202A", x: 70, y: 360, align: "left", size: 84, tilt: -2, ticks: "", delay: 0.1, exit: true };
          let v = {};
          try { v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {}; } catch (e) {}
          const P = Object.assign({}, DEF, v);
          const root = document.getElementById(ID);
          const g = root.querySelector(".lc"), card = root.querySelector(".lc-card"), tag = root.querySelector(".lc-tag");
          const t = root.querySelector(".lc-t"), s = root.querySelector(".lc-s"), tw = root.querySelector(".lc-ticks");
          t.textContent = P.title; t.style.fontSize = P.size + "px";
          if (P.sub) { s.textContent = P.sub; s.style.fontSize = Math.round(P.size * 0.36) + "px"; } else s.remove();
          if (P.tag) { tag.textContent = P.tag; tag.style.background = P.tagColor; card.style.paddingTop = '40px'; } else tag.remove();
          const tick = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';
          String(P.ticks || "").split("|").map((x) => x.trim()).filter(Boolean).slice(0, 2).forEach((x) => {
            const r = document.createElement("div"); r.className = "lc-tk"; r.innerHTML = "<i>" + tick + "</i><span></span>"; r.querySelector("span").textContent = x; tw.appendChild(r);
          });
          g.style.left = P.x + "px"; g.style.top = P.y + "px";
          gsap.set(g, { xPercent: P.align === "center" ? -50 : 0, rotation: Number(P.tilt), transformOrigin: "0% 50%" });
          function build() {
            const tl = gsap.timeline({ paused: true }), t0 = Number(P.delay);
            tl.fromTo(card, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.28, ease: "expo.out" }, t0);
            if (tag.isConnected) tl.fromTo(tag, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "back.out(1.6)" }, t0 + 0.12);
            const rows = tw.querySelectorAll(".lc-tk");
            if (rows.length) tl.fromTo(rows, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.22, ease: "power3.out", stagger: 0.09 }, t0 + 0.3);
            if (P.exit) tl.to(g, { opacity: 0, duration: 0.18, ease: "power1.in" }, Math.max(t0 + 0.8, D - 0.2));
            window.__timelines[ID] = tl;
            if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
          }
          Promise.all([document.fonts.load("900 " + P.size + "px Montserrat", "A"), document.fonts.load("700 30px Montserrat", "A")]).then(build, build);
        })();
      </script>
    </template>
  </body>
</html>
