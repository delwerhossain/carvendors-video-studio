<!doctype html>
<html
  data-composition-variables='[
    {"id":"line1","type":"string","label":"Big line","default":"New to the UK?"},
    {"id":"line2","type":"string","label":"Sub line","default":"Not sure which car is right for you?"},
    {"id":"top","type":"number","label":"Top (px)","default":200,"min":150,"max":900}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #hook-1 { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        #hook-1 .k-sign { position: absolute; left: 70px; right: 70px; top: calc(var(--top) * 1px); background: #00703c;
          border-radius: 34px; padding: 18px; box-shadow: 0 18px 44px rgb(0 0 0 / 35%); }
        #hook-1 .k-in { border: 6px solid #ffffff; border-radius: 22px; padding: 38px 44px 42px; display: flex; flex-direction: column; gap: 16px; }
        #hook-1 .k-row { display: flex; align-items: center; gap: 24px; }
        #hook-1 .k-arrow { display: block; flex: 0 0 96px; width: 96px; height: 96px; }
        #hook-1 .k-l1 { font-family: "Montserrat", sans-serif; font-weight: 800; font-size: 96px; line-height: 1; letter-spacing: -0.02em; color: #ffffff; }
        #hook-1 .k-l2 { font-family: "Montserrat", sans-serif; font-weight: 600; font-size: 44px; line-height: 1.15; color: #e6f2ea; }
      </style>
      <div id="hook-1" data-composition-id="hook-1" data-width="1080" data-height="1920">
        <div class="k-sign">
          <div class="k-in">
            <div class="k-row">
              <svg class="k-arrow" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V4M6 9.5L12 3.5l6 6"/></svg>
              <div class="k-l1" data-var-text="line1">New to the UK?</div>
            </div>
            <div class="k-l2" data-var-text="line2">Not sure which car is right for you?</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const R = "#hook-1 ", D = 3.2;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(R + ".k-sign", { x: -140, opacity: 0, rotation: -2 }, { x: 0, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out" }, 0.05);
          tl.fromTo(R + ".k-arrow", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 0.3);
          tl.fromTo(R + ".k-l2", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.4);
          tl.to(R + ".k-sign", { scale: 1.02, duration: Math.max(0.4, D - 1.3), ease: "sine.inOut" }, 0.55);
          tl.to(R + ".k-sign", { x: 160, opacity: 0, duration: 0.35, ease: "power2.in" }, Math.max(0.9, D - 0.4));
          window.__timelines["hook-1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
