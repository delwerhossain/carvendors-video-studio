<!doctype html>
<html
  data-composition-variables='[
    {"id":"kicker","type":"string","label":"Kicker","default":"REAL CUSTOMER"},
    {"id":"name","type":"string","label":"Name","default":"Tatiana"},
    {"id":"top","type":"number","label":"Top (px)","default":250,"min":150,"max":1150}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #who-1 { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        #who-1 .k-wrap { position: absolute; left: 70px; top: calc(var(--top) * 1px); display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
        #who-1 .k-kick { display: inline-block; background: #00703c; color: #fff; border-radius: 10px; padding: 6px 16px 8px;
          font-family: "Oswald", sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 0.12em; }
        #who-1 .k-name { display: inline-block; background: #f4f4f0; color: #111311; border: 5px solid #111311; border-radius: 14px; padding: 6px 30px 10px;
          font-family: "Oswald", sans-serif; font-weight: 700; font-size: 86px; letter-spacing: 0.04em; text-transform: uppercase;
          box-shadow: 0 12px 30px rgb(0 0 0 / 35%); }
      </style>
      <div id="who-1" data-composition-id="who-1" data-width="1080" data-height="1920">
        <div class="k-wrap">
          <span class="k-kick" data-var-text="kicker">REAL CUSTOMER</span>
          <span class="k-name" data-var-text="name">Tatiana</span>
        </div>
      </div>
      <script>
        (function () {
          const R = "#who-1 ", D = 1.8;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(R + ".k-kick", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0.1);
          tl.fromTo(R + ".k-name", { x: -80, opacity: 0, rotation: -3 }, { x: 0, opacity: 1, rotation: 0, duration: 0.45, ease: "back.out(1.6)" }, 0.25);
          tl.to(R + ".k-wrap", { x: -70, opacity: 0, duration: 0.3, ease: "power2.in" }, Math.max(1, D - 0.35));
          window.__timelines["who-1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
