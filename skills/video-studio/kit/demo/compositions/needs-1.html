<!doctype html>
<html
  data-composition-variables='[
    {"id":"p1","type":"string","label":"Plate 1","default":"YOUR BUDGET"},
    {"id":"p2","type":"string","label":"Plate 2","default":"FAMILY CAR"},
    {"id":"p3","type":"string","label":"Plate 3","default":"LOW TAX"},
    {"id":"top","type":"number","label":"Top (px)","default":760,"min":150,"max":1150}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #needs-1 { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        #needs-1 .k-stack { position: absolute; left: 70px; top: calc(var(--top) * 1px); display: flex; flex-direction: column; gap: 22px; align-items: flex-start; }
        #needs-1 .k-plate { display: block; background: #f7d117; color: #111311; border: 4px solid #111311; border-radius: 12px;
          padding: 8px 26px 10px; font-family: "Oswald", sans-serif; font-weight: 700; font-size: 60px; letter-spacing: 0.05em; text-transform: uppercase;
          box-shadow: 0 10px 24px rgb(0 0 0 / 30%); }
      </style>
      <div id="needs-1" data-composition-id="needs-1" data-width="1080" data-height="1920">
        <div class="k-stack">
          <span class="k-plate k-p1" data-var-text="p1">YOUR BUDGET</span>
          <span class="k-plate k-p2" data-var-text="p2">FAMILY CAR</span>
          <span class="k-plate k-p3" data-var-text="p3">LOW TAX</span>
        </div>
      </div>
      <script>
        (function () {
          const R = "#needs-1 ", D = 2.2, AT = [0.1, 0.5, 0.9]; // AT: entrance second for each plate
          const tl = gsap.timeline({ paused: true });
          [".k-p1", ".k-p2", ".k-p3"].forEach(function (c, i) {
            tl.fromTo(R + c, { y: -46, opacity: 0, rotation: (i % 2 ? 3 : -3) }, { y: 0, opacity: 1, rotation: 0, duration: 0.42, ease: "back.out(2)" }, AT[i]);
            tl.to(R + c, { scale: 1.03, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, AT[i] + 0.45);
          });
          tl.to(R + ".k-stack", { x: -60, opacity: 0, duration: 0.3, ease: "power2.in" }, Math.max(1, D - 0.35));
          window.__timelines["needs-1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
