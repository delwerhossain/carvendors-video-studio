<!doctype html>
<html
  data-composition-variables='[
    {"id":"place","type":"string","label":"Place","default":"Northampton"},
    {"id":"vendor","type":"string","label":"Vendor","default":"B&F Cars"},
    {"id":"miles","type":"string","label":"Miles text","default":"Found for you"},
    {"id":"top","type":"number","label":"Top (px)","default":230,"min":150,"max":1000}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #place-1 { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        #place-1 .k-sign { position: absolute; left: 70px; right: 70px; top: calc(var(--top) * 1px); background: #00703c; border-radius: 34px; padding: 18px;
          box-shadow: 0 18px 44px rgb(0 0 0 / 35%); }
        #place-1 .k-in { border: 6px solid #fff; border-radius: 22px; padding: 26px 34px; display: flex; flex-direction: column; gap: 18px; }
        #place-1 .k-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        #place-1 .k-place { font-family: "Montserrat", sans-serif; font-weight: 800; font-size: 78px; color: #fff; line-height: 1; }
        #place-1 .k-arrow { display: block; width: 92px; height: 92px; flex: 0 0 92px; }
        #place-1 .k-sub { display: flex; align-items: center; gap: 18px; }
        #place-1 .k-vendor { display: inline-block; background: #f4f4f0; color: #111311; border: 4px solid #111311; border-radius: 12px; padding: 4px 18px 6px;
          font-family: "Oswald", sans-serif; font-weight: 700; font-size: 46px; letter-spacing: 0.04em; text-transform: uppercase; }
        #place-1 .k-miles { font-family: "Montserrat", sans-serif; font-weight: 600; font-size: 38px; color: #e6f2ea; }
      </style>
      <div id="place-1" data-composition-id="place-1" data-width="1080" data-height="1920">
        <div class="k-sign"><div class="k-in">
          <div class="k-row">
            <div class="k-place" data-var-text="place">Northampton</div>
            <svg class="k-arrow" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12h16M14 6.5l5.5 5.5-5.5 5.5"/></svg>
          </div>
          <div class="k-sub"><span class="k-vendor" data-var-text="vendor">B&amp;F Cars</span><span class="k-miles" data-var-text="miles">Found for you</span></div>
        </div></div>
      </div>
      <script>
        (function () {
          const R = "#place-1 ", D = 3.0;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(R + ".k-sign", { x: 1080, opacity: 1 }, { x: 0, duration: 0.55, ease: "power3.out" }, 0.05);
          tl.fromTo(R + ".k-arrow", { x: -30 }, { x: 0, duration: 0.5, ease: "back.out(2)" }, 0.45);
          tl.fromTo(R + ".k-vendor", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 0.55);
          tl.fromTo(R + ".k-miles", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.75);
          tl.to(R + ".k-sign", { x: -1080, duration: 0.45, ease: "power2.in" }, Math.max(1.2, D - 0.45));
          window.__timelines["place-1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
