<!doctype html>
<html
  data-composition-variables='[
    {"id":"headline","type":"string","label":"Headline","default":"Tell us what you need."},
    {"id":"sub","type":"string","label":"Sub line","default":"Free car-finding help. No obligation to buy."},
    {"id":"cta","type":"string","label":"CTA","default":"Request a free callback"},
    {"id":"phone","type":"string","label":"Phone","default":"0330 113 1668"},
    {"id":"url","type":"string","label":"Website","default":"carvendors.co.uk"}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #end-1 { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        #end-1 .k-logo { position: absolute; left: 150px; right: 150px; top: 190px; background: #fff; border-radius: 26px; padding: 26px 34px; box-shadow: 0 18px 40px rgb(0 0 0 / 30%); }
        #end-1 .k-logo img { display: block; width: 100%; height: auto; }
        #end-1 .k-head { position: absolute; left: 110px; right: 110px; top: 420px; text-align: center; font-family: "Montserrat", sans-serif; font-weight: 800;
          font-size: 92px; line-height: 1.02; color: #fff; text-shadow: 0 4px 0 #111311; }
        #end-1 .k-sub { position: absolute; left: 130px; right: 130px; top: 640px; text-align: center; font-family: "Montserrat", sans-serif; font-weight: 600;
          font-size: 44px; line-height: 1.2; color: #f4f4f0; }
        #end-1 .k-cta { position: absolute; left: 110px; right: 110px; top: 820px; background: #00703c; border-radius: 30px; padding: 14px; box-shadow: 0 18px 40px rgb(0 0 0 / 35%); }
        #end-1 .k-cta-in { border: 5px solid #fff; border-radius: 20px; padding: 26px; text-align: center; font-family: "Montserrat", sans-serif; font-weight: 800; font-size: 56px; color: #fff; }
        #end-1 .k-phone { position: absolute; left: 0; right: 0; top: 1030px; display: flex; justify-content: center; }
        #end-1 .k-phone span { display: inline-block; background: #f7d117; color: #111311; border: 5px solid #111311; border-radius: 14px; padding: 4px 34px 8px;
          font-family: "Oswald", sans-serif; font-weight: 700; font-size: 92px; letter-spacing: 0.04em; }
        #end-1 .k-url { position: absolute; left: 0; right: 0; top: 1180px; text-align: center; font-family: "Oswald", sans-serif; font-weight: 700; font-size: 44px; letter-spacing: 0.08em; color: #f4f4f0; }
      </style>
      <div id="end-1" data-composition-id="end-1" data-width="1080" data-height="1920">
        <div class="k-logo"><img src="../assets/brand/cv-logo-dark.png" alt="CarVendors.co.uk" /></div>
        <div class="k-head" data-var-text="headline">Tell us what you need.</div>
        <div class="k-sub" data-var-text="sub">Free car-finding help. No obligation to buy.</div>
        <div class="k-cta"><div class="k-cta-in" data-var-text="cta">Request a free callback</div></div>
        <div class="k-phone"><span data-var-text="phone">0330 113 1668</span></div>
        <div class="k-url" data-var-text="url">carvendors.co.uk</div>
      </div>
      <script>
        (function () {
          const R = "#end-1 ", D = 2.6;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(R + ".k-logo", { y: -50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.1);
          tl.fromTo(R + ".k-head", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.3);
          tl.fromTo(R + ".k-sub", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.55);
          tl.fromTo(R + ".k-cta", { x: -1080 }, { x: 0, duration: 0.55, ease: "power3.out" }, 0.75);
          tl.fromTo(R + ".k-phone span", { y: -40, opacity: 0, rotation: -3 }, { y: 0, opacity: 1, rotation: 0, duration: 0.45, ease: "back.out(2)" }, 1.05);
          tl.fromTo(R + ".k-url", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.3);
          tl.to(R + ".k-phone span", { scale: 1.04, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor((D - 1.8) / 0.5)) }, 1.6);
          window.__timelines["end-1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
