<!doctype html>
<html
  data-composition-variables='[
    {"id":"kicker","type":"string","label":"Kicker","default":"HOW IT WORKS"},
    {"id":"title","type":"string","label":"Title","default":"Free help. No obligation to buy."},
    {"id":"top","type":"number","label":"Top (px)","default":260,"min":150,"max":1000}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #__ID__ { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        #__ID__ .k-panel { position: absolute; left: 70px; right: 70px; top: calc(var(--top) * 1px); background: #1d4f91; border-radius: 30px; padding: 16px;
          box-shadow: 0 18px 44px rgb(0 0 0 / 30%); }
        #__ID__ .k-in { border: 5px solid #ffffff; border-radius: 20px; padding: 30px 38px 34px; display: flex; flex-direction: column; gap: 12px; }
        #__ID__ .k-kick { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 0.12em; color: #f7d117; }
        #__ID__ .k-title { font-family: "Montserrat", sans-serif; font-weight: 800; font-size: 64px; line-height: 1.05; color: #ffffff; }
      </style>
      <div id="__ID__" data-composition-id="__ID__" data-width="1080" data-height="1920">
        <div class="k-panel"><div class="k-in">
          <div class="k-kick" data-var-text="kicker">HOW IT WORKS</div>
          <div class="k-title" data-var-text="title">Free help. No obligation to buy.</div>
        </div></div>
      </div>
      <script>
        (function () {
          const R = "#__ID__ ", D = __DUR__;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(R + ".k-panel", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.05);
          tl.fromTo(R + ".k-kick", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.3);
          tl.to(R + ".k-panel", { y: -10, duration: Math.max(0.4, D - 1), ease: "sine.inOut" }, 0.5);
          tl.to(R + ".k-panel", { y: -80, opacity: 0, duration: 0.3, ease: "power2.in" }, Math.max(0.9, D - 0.35));
          window.__timelines["__ID__"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
