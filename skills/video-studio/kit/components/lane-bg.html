<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #__ID__ { position: absolute; inset: 0; overflow: hidden; pointer-events: none; background: #1c2023; }
        #__ID__ .k-tex { position: absolute; inset: 0; background-image: radial-gradient(rgb(255 255 255 / 5%) 1.2px, transparent 1.4px); background-size: 9px 9px; }
        #__ID__ .k-lane { position: absolute; top: -240px; width: 20px; height: 2400px;
          background: repeating-linear-gradient(180deg, #f4f4f0 0 150px, transparent 150px 300px); opacity: 0.85; }
        #__ID__ .k-l1 { left: 62px; } #__ID__ .k-l2 { right: 62px; }
        #__ID__ .k-edge { position: absolute; top: 0; bottom: 0; width: 14px; background: #f7d117; opacity: 0.9; }
        #__ID__ .k-e1 { left: 20px; } #__ID__ .k-e2 { right: 20px; }
        #__ID__ .k-glow { position: absolute; left: 140px; top: 500px; width: 800px; height: 800px; border-radius: 50%;
          background: radial-gradient(closest-side, rgb(0 112 60 / 26%), transparent 72%); }
      </style>
      <div id="__ID__" data-composition-id="__ID__" data-width="1080" data-height="1920">
        <div class="k-tex"></div>
        <div class="k-glow"></div>
        <div class="k-edge k-e1"></div><div class="k-edge k-e2"></div>
        <div class="k-lane k-l1"></div><div class="k-lane k-l2"></div>
      </div>
      <script>
        (function () {
          const R = "#__ID__ ", D = __DUR__;
          const tl = gsap.timeline({ paused: true });
          // lane dashes scroll toward the viewer: one dash cycle (300px) every 0.5 s
          tl.fromTo(R + ".k-lane", { y: 0 }, { y: 300 * Math.ceil(D / 0.5), duration: D, ease: "none" }, 0);
          tl.fromTo(R + ".k-glow", { scale: 0.9 }, { scale: 1.1, duration: D / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
          window.__timelines["__ID__"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
