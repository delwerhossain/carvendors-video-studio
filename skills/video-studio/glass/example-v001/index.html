      /* ---- footage: two non-timed wrappers per shot (kb = drift, pz = punch) ---- */

      #pill-sheen { position: absolute; top: -20px; bottom: -20px; left: 0; width: 180px;
        background: linear-gradient(100deg, rgb(255 255 255 / 0) 0%, rgb(255 255 255 / 0.32) 50%, rgb(255 255 255 / 0) 100%);
        opacity: 0; }

      /* ---- featured dealer badge ---- */
      #dealer { position: absolute; left: 72px; top: 640px; z-index: 5; }
      #dealer .kick { display: inline-block; padding: 12px 22px 13px; border-radius: 18px;

    <script>
      const tl = gsap.timeline({ paused: true });

      // ---------- footage drift (Ken Burns) + entry punches ----------
      const shots = [
        // id, start, dur, scale from -> to, x from -> to
        ["hook", 0.00, 1.40, 1.00, 1.10, 0, 0],
        ["a", 1.40, 1.55, 1.05, 1.11, -14, 10],
        ["b", 2.95, 1.35, 1.10, 1.04, 12, -8],
        ["c", 4.30, 1.55, 1.04, 1.10, 0, -16],
        ["d", 5.85, 2.35, 1.10, 1.03, -10, 10],
        ["e1", 8.20, 3.20, 1.03, 1.11, 10, -10],
        ["e2", 11.40, 2.00, 1.10, 1.04, -12, 12],
        ["f", 13.40, 2.00, 1.03, 1.06, 0, 0],
        ["g", 15.40, 4.25, 1.02, 1.10, 0, -10],
        ["h", 19.65, 1.43, 1.10, 1.04, 10, -10],
        ["i", 21.08, 1.27, 1.04, 1.10, -10, 10],
        ["j", 22.35, 1.80, 1.03, 1.09, 0, 0],
      ];
      shots.forEach(([id, s, d, s0, s1, x0, x1]) => {
        tl.fromTo("#kb-" + id, { scale: s0, x: x0 }, { scale: s1, x: x1, duration: d, ease: "none", immediateRender: false }, s);
      });
      // every hard cut lands with a small settle punch (After-Effects style ease-out)
      [["b", 2.95], ["c", 4.30], ["d", 5.85], ["e1", 8.20], ["e2", 11.40], ["g", 15.40], ["h", 19.65], ["i", 21.08], ["j", 22.35]].forEach(([id, s]) => {
        tl.fromTo("#pz-" + id, { scale: 1.07 }, { scale: 1, duration: 0.42, ease: "expo.out", immediateRender: false }, s);
      });
      // hook: slow push toward the ball, then impact cut with a zoom-blur landing on shot A
      tl.fromTo("#pz-hook", { scale: 1 }, { scale: 1.16, duration: 0.25, ease: "power2.in", immediateRender: false }, 1.15);
      tl.fromTo("#pz-a", { scale: 1.32, filter: "blur(16px)" }, { scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out", immediateRender: false }, 1.40);
      // whip into F, then the "Match found" camera punch
      tl.fromTo("#pz-f", { x: 260, filter: "blur(18px)" }, { x: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out", immediateRender: false }, 13.40);
      tl.fromTo("#kb-f", { scale: 1.03 }, { scale: 1.16, duration: 0.6, ease: "expo.out", immediateRender: false }, 13.76);
      // whip pan out of the body into the end card
      tl.fromTo("#pz-j", { x: 0, filter: "blur(0px)" }, { x: -900, filter: "blur(22px)", duration: 0.26, ease: "power3.in", immediateRender: false }, 23.86);

      // ---------- flash frames ----------
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.9, duration: 0.05, ease: "none", immediateRender: false }, 1.36)
        .to("#flash", { opacity: 0, duration: 0.32, ease: "power2.out" }, 1.41)
        .fromTo("#flash", { opacity: 0 }, { opacity: 0.45, duration: 0.04, ease: "none", immediateRender: false }, 13.74)
        .to("#flash", { opacity: 0, duration: 0.24, ease: "power2.out" }, 13.78);

      // ---------- dynamic pill ----------
      tl.fromTo("#pill", { scale: 0.94 }, { scale: 1, duration: 0.55, ease: "expo.out", immediateRender: false }, 1.40);
      const pin = (id, t, dur = 0.42) => tl.fromTo(id, { opacity: 0, y: 46, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: dur, ease: "expo.out", immediateRender: false }, t);
      const pout = (id, t) => tl.fromTo(id, { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -46, filter: "blur(6px)", duration: 0.24, ease: "power2.in", immediateRender: false }, t);
      tl.set("#ps1", { opacity: 1 }, 1.40);
      tl.fromTo("#ps1", { scale: 0.9 }, { scale: 1, duration: 0.6, ease: "expo.out", immediateRender: false }, 1.40);
      pout("#ps1", 8.10); pin("#ps2", 8.30);
      pout("#ps2", 13.30); pin("#ps3", 13.50);
      tl.fromTo("#ps3-tick", { attr: { "stroke-dashoffset": 16 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.out", immediateRender: false }, 13.80);
      pout("#ps3", 15.30); pin("#ps4", 15.50);
      pout("#ps4", 19.55); pin("#ps5", 19.75);
      tl.fromTo("#ps5-tick", { attr: { "stroke-dashoffset": 16 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.out", immediateRender: false }, 20.05);
      // searching dots: baked stepped schedule (deterministic)
      for (let k = 0; k < 14; k++) {
        const t = 8.55 + k * 0.33, i = (k % 3) + 1;
        tl.fromTo(`#ps2 .dot3 i:nth-child(${i})`, { opacity: 1 }, { opacity: 0.25, duration: 0.33, ease: "power1.out", immediateRender: false }, t);
      }
      // light sheen passes across the glass (searching + on each state change)
      [[1.75, 0.9], [8.6, 1.1], [10.2, 1.1], [11.8, 1.1], [13.55, 0.8], [15.55, 0.8], [19.8, 0.8]].forEach(([t, d]) => {
        tl.fromTo("#pill-sheen", { x: -220, opacity: 1 }, { x: 700, opacity: 1, duration: d, ease: "power2.inOut", immediateRender: false }, t);
        tl.set("#pill-sheen", { opacity: 0 }, t + d);
      });
      tl.fromTo("#pill", { x: 0 }, { x: -1100, duration: 0.26, ease: "power3.in", immediateRender: false }, 23.86);

      // ---------- featured dealer badge ----------
      tl.fromTo("#dealer-kick", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, 16.20);
      tl.fromTo("#dealer-card", { clipPath: "inset(0 100% 0 0 round 26px)" }, { clipPath: "inset(0 0% 0 0 round 26px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 16.05);
      tl.fromTo("#dealer-card img", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, 16.15);
      tl.to("#dealer-card", { opacity: 0, y: -10, duration: 0.22, ease: "power2.in" }, 19.25);

      // ---------- end card ----------
      tl.fromTo("#end", { x: 1080, filter: "blur(20px)" }, { x: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out", immediateRender: false }, 23.92);
      tl.fromTo("#glow-g", { x: 0, y: 0, scale: 1 }, { x: 120, y: 80, scale: 1.12, duration: 9, ease: "sine.inOut", immediateRender: false }, 23.92);
      tl.fromTo("#glow-r", { x: 0, y: 0, scale: 1.1 }, { x: -100, y: -60, scale: 1, duration: 9, ease: "sine.inOut", immediateRender: false }, 23.92);
      tl.fromTo("#frame", { clipPath: "inset(50% 0% 50% 0% round 32px)" }, { clipPath: "inset(0% 0% 0% 0% round 32px)", duration: 0.7, ease: "expo.out", immediateRender: false }, 24.30);
      tl.fromTo("#frame-img", { scale: 1.28 }, { scale: 1.04, duration: 1.0, ease: "expo.out", immediateRender: false }, 24.30);
      tl.fromTo("#frame-img", { scale: 1.04, x: 0 }, { scale: 1.16, x: -26, duration: 2.9, ease: "none", immediateRender: false }, 25.30);
      tl.to("#frame", { opacity: 0, scale: 0.96, duration: 0.35, ease: "power2.in" }, 28.30);
      // lockup
      tl.set("#lockup", { opacity: 1 }, 23.92);
      tl.fromTo("#lk-logo", { clipPath: "inset(0 100% 0 0)", y: 20 }, { clipPath: "inset(0 0% 0 0)", y: 0, duration: 0.8, ease: "expo.out", immediateRender: false }, 28.65);
      tl.fromTo("#lk-sheen", { x: -240, opacity: 1 }, { x: 900, opacity: 1, duration: 1.1, ease: "power2.inOut", immediateRender: false }, 29.6);
      tl.set("#lk-sheen", { opacity: 0 }, 30.7);
      tl.fromTo("#lk-url", { opacity: 0, y: 30, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, 28.95);
      tl.fromTo("#lk-dealer", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, 29.30);
      tl.fromTo("#lk-url", { scale: 1 }, { scale: 1.03, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 30.9);
      // hide lockup pieces before their entrance
      tl.set(["#lk-logo"], { clipPath: "inset(0 100% 0 0)" }, 23.92);
      tl.set(["#lk-url", "#lk-dealer"], { opacity: 0 }, 23.92);

      window.__timelines["main"] = tl;
    </script>
  </body>
