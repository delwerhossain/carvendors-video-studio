<!doctype html>
<!--
  red-keyword  (CarVendors x B&F small red keyword backing, 1080x1920)

  One keyword in white Manrope Bold on a small red (#E3262F) rounded block, optionally preceded by a
  plain white lead word ("Sporty" white + "Interior" on red). Use for one or two words of emphasis only;
  red is an accent, not the video theme.

  Variables (host data-variable-values):
    word     string   keyword on the red block                        "Sporty"
    lead     string   optional plain white word before it ("" = none)  ""
    layout   enum     "stack" (lead above, like the storyboard) | "inline"   "stack"
    size     number   font px                                          112
    x, y     number   top-left in canvas px                            72, 560
    red      color    block colour                                     "#E3262F"
    delay    number   entrance start, s after the host start           0.05
    exit     boolean  200 ms fade out at the end of the slot           true

  Timing: lead word rises out of a mask (450 ms, expo.out); red block wipes left-to-right
  (scaleX 0 -> 1, origin left, 340 ms, expo.out) starting +0.14 s after the lead (or at delay);
  keyword text slides in from the left inside the block (+0.12 s, 360 ms, expo.out).
  Exit 200 ms (power2.in) ending 20 ms before the slot ends.

  Mount:
    python3 tools/mount.py add . red-keyword kw-1 --start 3 --dur 2 --track 2 --vars '{"word":"Sporty"}'
    python3 tools/mount.py add . red-keyword kw-2 --start 9 --dur 2.5 --vars '{"lead":"Sporty","word":"Interior"}'
  Needs assets/fonts/Manrope-Bold.ttf.
-->
<html
  data-composition-variables='[
    {"id":"word","type":"string","label":"Keyword (on red)","default":"Sporty"},
    {"id":"lead","type":"string","label":"Lead word (white)","default":""},
    {"id":"layout","type":"enum","label":"Layout","default":"stack","options":[{"value":"stack","label":"Stacked"},{"value":"inline","label":"Inline"}]},
    {"id":"size","type":"number","label":"Size (px)","default":112,"min":48,"max":200},
    {"id":"x","type":"number","label":"Left (px)","default":72,"min":0,"max":1000},
    {"id":"y","type":"number","label":"Top (px)","default":560,"min":0,"max":1900},
    {"id":"red","type":"color","label":"Block colour","default":"#E3262F"},
    {"id":"delay","type":"number","label":"Entrance delay (s)","default":0.05,"min":0,"max":5,"step":0.05},
    {"id":"exit","type":"boolean","label":"Exit at end","default":true}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Manrope"; src: url("../assets/fonts/Manrope-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; }
        #kw-free { position: absolute; inset: 0; pointer-events: none; }
        #kw-free .rk-wrap {
          position: absolute; left: 72px; top: 560px;
          display: flex; flex-direction: column; align-items: flex-start; gap: 0.06em;
          font-family: "Manrope", sans-serif; font-weight: 700; font-size: 112px;
          line-height: 1; letter-spacing: -0.02em; color: #fff;
          filter: drop-shadow(0 4px 18px rgb(0 0 0 / 0.16));
        }
        #kw-free .rk-wrap.is-inline { flex-direction: row; align-items: baseline; gap: 0.24em; }
        #kw-free .rk-mask { display: block; overflow: hidden; padding: 0.1em 0.12em 0.16em 0.06em; margin: -0.1em -0.12em -0.16em -0.06em; }
        #kw-free .rk-lead { display: block; white-space: nowrap; }
        #kw-free .rk-key { position: relative; display: block; overflow: hidden; border-radius: 0.12em; padding: 0.07em 0.2em 0.13em; }
        #kw-free .rk-bg { position: absolute; inset: 0; display: block; background: var(--red, #E3262F); transform-origin: 0% 50%; }
        #kw-free .rk-text { position: relative; display: block; white-space: nowrap; }
      </style>
      <div id="kw-free" data-composition-id="kw-free" data-width="1080" data-height="1920">
        <div class="rk-wrap">
          <div class="rk-mask"><div class="rk-lead"></div></div>
          <div class="rk-key"><span class="rk-bg"></span><span class="rk-text">Sporty</span></div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "kw-free", D = 1.82;
          const DEF = { word: "Sporty", lead: "", layout: "stack", size: 112, x: 72, y: 560, red: "#E3262F", delay: 0.05, exit: true };
          let v = {};
          try { v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {}; } catch (e) {}
          const P = Object.assign({}, DEF, v);
          const root = document.getElementById(ID);
          const wrap = root.querySelector(".rk-wrap");
          Object.assign(wrap.style, { left: P.x + "px", top: P.y + "px", fontSize: P.size + "px" });
          wrap.style.setProperty("--red", P.red);
          if (P.layout === "inline") wrap.classList.add("is-inline");
          const leadText = String(P.lead || "").trim();
          const mask = root.querySelector(".rk-mask");
          const lead = root.querySelector(".rk-lead");
          if (leadText) lead.textContent = leadText; else mask.remove();
          root.querySelector(".rk-text").textContent = P.word;

          const tl = gsap.timeline({ paused: true });
          let t = Number(P.delay);
          if (leadText) {
            tl.fromTo(lead, { yPercent: 130 }, { yPercent: 0, duration: 0.45, ease: "expo.out" }, t);
            t += 0.14;
          }
          tl.fromTo(root.querySelector(".rk-bg"), { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "expo.out" }, t);
          tl.fromTo(root.querySelector(".rk-text"), { x: -46, opacity: 0 }, { x: 0, opacity: 1, duration: 0.36, ease: "expo.out" }, t + 0.12);
          if (P.exit) {
            tl.to(wrap, { opacity: 0, y: -8, duration: 0.2, ease: "power2.in" }, Math.max(t + 0.6, D - 0.22));
          }
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
