<!doctype html>
<!--
  glass-card  (CarVendors x B&F neutral liquid/frosted glass, 1080x1920)

  One short line (max 2 lines) of white Source Sans 3 SemiBold on neutral glass. The glass is a real
  backdrop-filter (blur 28px, saturate 1.15) over whatever is painted underneath, so the scene colour
  bleeds through (red car -> reddish glass, sky -> bluish). No black fill, no outer shadow, no gold rim.

  Variables (host data-variable-values):
    text     string   card copy, 1-2 short lines               "Free car-finding help"
    x, y     number   top-left of the card in canvas px          72, 905
    size     number   text px (44-52 recommended)                48
    maxW     number   max card width px (safe zone 72-900)        828
    fill     number   white fill opacity, 0.04-0.08               0.06
    delay    number   entrance start, s after the host start      0.05
    blurIn   boolean  ramp the backdrop blur 0 -> 28px on entry   true
    exit     boolean  200 ms fade/lift out at the end of the slot true

  Timing: entrance 280 ms (16 px rise + opacity, power3.out, blur ramps with it); exit 200 ms
  (power2.in) ending 20 ms before the host's data-duration. Hold = duration - delay - 0.5 s.

  Mount (instance id must be unique per use):
    python3 tools/mount.py add . glass-card card-1 --start 1 --dur 2 --track 3 \
      --vars '{"text":"Free car-finding help","y":905}'
  Placeholders card-network / 2.32 are filled by mount.py. Needs assets/fonts/SourceSans3-SemiBold.ttf.

  Do not put this inside a parent that animates opacity, filter, mask or clip-path: that parent becomes
  the backdrop root and the card stops seeing the video behind it (blur pops in at the end of the fade).
  Animate the card itself (this file already does).
-->
<html
  data-composition-variables='[
    {"id":"text","type":"string","label":"Text","default":"Free car-finding help"},
    {"id":"x","type":"number","label":"Left (px)","default":72,"min":0,"max":1000},
    {"id":"y","type":"number","label":"Top (px)","default":905,"min":0,"max":1900},
    {"id":"size","type":"number","label":"Text size (px)","default":48,"min":30,"max":72},
    {"id":"maxW","type":"number","label":"Max width (px)","default":828,"min":200,"max":1000},
    {"id":"fill","type":"number","label":"White fill","default":0.06,"min":0,"max":0.2,"step":0.01},
    {"id":"delay","type":"number","label":"Entrance delay (s)","default":0.05,"min":0,"max":5,"step":0.05},
    {"id":"blurIn","type":"boolean","label":"Blur ramps in","default":true},
    {"id":"exit","type":"boolean","label":"Exit at end","default":true}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Source Sans 3"; src: url("../assets/fonts/SourceSans3-SemiBold.ttf") format("truetype"); font-weight: 600; font-style: normal; }
        #card-network { position: absolute; inset: 0; pointer-events: none; }
        #card-network .gc-card {
          --gb: 28px; --gs: 1.15; --fill: 0.06;
          position: absolute; left: 72px; top: 905px; box-sizing: border-box;
          width: max-content; max-width: 828px;
          padding: 0.5em 0.8em 0.56em;
          border-radius: 24px;
          background: linear-gradient(180deg, rgb(255 255 255 / calc(var(--fill) + 0.02)), rgb(255 255 255 / calc(var(--fill) - 0.02)));
          border: 1.5px solid rgb(255 255 255 / 0.25);
          box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.14);
          -webkit-backdrop-filter: blur(var(--gb)) saturate(var(--gs));
          backdrop-filter: blur(var(--gb)) saturate(var(--gs));
          font-family: "Source Sans 3", sans-serif; font-weight: 600; font-size: 48px; line-height: 1.16;
          color: #fff; letter-spacing: -0.003em;
          text-shadow: 0 1px 2px rgb(0 0 0 / 0.16);
          text-wrap: balance;
          opacity: 0;
        }
      </style>
      <div id="card-network" data-composition-id="card-network" data-width="1080" data-height="1920">
        <div class="gc-card"><span class="gc-text">Free car-finding help</span></div>
      </div>
      <script>
        (function () {
          const ID = "card-network", D = 2.32;
          const DEF = { text: "Free car-finding help", x: 72, y: 905, size: 48, maxW: 828, fill: 0.06, delay: 0.05, blurIn: true, exit: true };
          let v = {};
          try { v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {}; } catch (e) {}
          const P = Object.assign({}, DEF, v);
          const root = document.getElementById(ID);
          const card = root.querySelector(".gc-card");
          root.querySelector(".gc-text").textContent = P.text;
          Object.assign(card.style, { left: P.x + "px", top: P.y + "px", maxWidth: P.maxW + "px", fontSize: P.size + "px" });
          card.style.setProperty("--fill", String(P.fill));

          const tl = gsap.timeline({ paused: true });
          const t0 = Number(P.delay);
          tl.fromTo(card,
            { opacity: 0, y: 16, "--gb": P.blurIn ? "0px" : "28px", "--gs": P.blurIn ? 1 : 1.15 },
            { opacity: 1, y: 0, "--gb": "28px", "--gs": 1.15, duration: 0.28, ease: "power3.out" }, t0);
          if (P.exit) {
            tl.to(card, { opacity: 0, y: -8, duration: 0.2, ease: "power2.in" }, Math.max(t0 + 0.45, D - 0.22));
          }
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
