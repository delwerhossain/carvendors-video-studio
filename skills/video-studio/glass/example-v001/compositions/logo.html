<!doctype html>
<!--
  logo-header  (CarVendors x B&F persistent brand header, 1080x1920)

  Top-left CarVendors mark (green wheel icon + "CarVendors.co.uk" wordmark, both cropped from
  cv-logo-light.png so the lettering is the real brand asset; the tagline and green bar are left out
  because they would be ~7 px tall at this size) with a small "Featured dealer: B&F Cars" line under it
  in Source Sans 3 SemiBold, white 85%. Legibility on bright sky comes from a very soft drop-shadow that
  follows the glyphs, never a dark box. Fades/slides in once and stays for the whole slot.

  Variables (host data-variable-values):
    dealer   string   attribution line                        "Featured dealer: B&F Cars"
    mode     enum     "image" (real wordmark) | "text" (Manrope Bold)   "image"
    x, y     number   top-left in canvas px                   72, 150
    scale    number   overall scale (1 = ~470 px wide)          1
    delay    number   entrance start, s                        0.1
    exit     boolean  fade out at the end of the slot          false

  Timing: 450 ms, 12 px rise + opacity (power3.out); dealer line follows +0.08 s. No exit by default:
  give the host the full composition duration.

  Mount:
    python3 tools/mount.py add . logo-header logo --start 0 --dur 8 --track 5
  Needs assets/brand/cv-icon-light.png, assets/brand/cv-wordmark-light.png,
  assets/fonts/SourceSans3-SemiBold.ttf (+ Manrope-Bold.ttf for mode "text").
  y 150 sits above the 300 px safe line on purpose (brand mark, not key copy); check it against the
  TikTok/Reels top bar in a platform preview and push it to ~200 if the tabs cover it.
-->
<html
  data-composition-variables='[
    {"id":"dealer","type":"string","label":"Dealer line","default":"Featured dealer: B&F Cars"},
    {"id":"mode","type":"enum","label":"Wordmark","default":"image","options":[{"value":"image","label":"Logo artwork"},{"value":"text","label":"Manrope text"}]},
    {"id":"x","type":"number","label":"Left (px)","default":72,"min":0,"max":1000},
    {"id":"y","type":"number","label":"Top (px)","default":150,"min":0,"max":1900},
    {"id":"scale","type":"number","label":"Scale","default":1,"min":0.5,"max":2,"step":0.05},
    {"id":"delay","type":"number","label":"Entrance delay (s)","default":0.1,"min":0,"max":5,"step":0.05},
    {"id":"exit","type":"boolean","label":"Exit at end","default":false}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Manrope"; src: url("../assets/fonts/Manrope-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; }
        @font-face { font-family: "Source Sans 3"; src: url("../assets/fonts/SourceSans3-SemiBold.ttf") format("truetype"); font-weight: 600; font-style: normal; }
        #logo { position: absolute; inset: 0; pointer-events: none; }
        #logo .lh-box {
          position: absolute; left: 72px; top: 150px; transform-origin: 0 0;
          display: flex; align-items: center; gap: 18px;
          filter: drop-shadow(0 1px 10px rgb(0 0 0 / 0.3)) drop-shadow(0 0 1px rgb(0 0 0 / 0.25));
        }
        #logo .lh-icon { display: block; width: 80px; height: 80px; }
        #logo .lh-col { display: flex; flex-direction: column; gap: 9px; }
        #logo .lh-wm { display: block; width: 372px; height: auto; }
        #logo .lh-wmtext { display: none; font-family: "Manrope", sans-serif; font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: -0.01em; color: #fff; }
        #logo .lh-box.is-text .lh-wm { display: none; }
        #logo .lh-box.is-text .lh-wmtext { display: block; }
        #logo .lh-dealer { display: inline-block; align-self: flex-start; font-family: "Source Sans 3", sans-serif; font-weight: 600; font-size: 30px; line-height: 1; color: #fff; white-space: nowrap; padding: 7px 14px 8px; border-radius: 14px; background: rgb(255 255 255 / 0.06); border: 1px solid rgb(255 255 255 / 0.22); -webkit-backdrop-filter: blur(22px) saturate(1.1) brightness(0.58); backdrop-filter: blur(22px) saturate(1.1) brightness(0.58); }
      </style>
      <div id="logo" data-composition-id="logo" data-width="1080" data-height="1920">
        <div class="lh-box">
          <img class="lh-icon" src="../assets/brand/cv-icon-light.png" alt="" />
          <div class="lh-col">
            <img class="lh-wm" src="../assets/brand/cv-wordmark-light.png" alt="CarVendors.co.uk" />
            <span class="lh-wmtext">CarVendors.co.uk</span>
            <span class="lh-dealer">Featured dealer: B&amp;F Cars</span>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const ID = "logo", D = 22.5;
          const DEF = { dealer: "Featured dealer: B&F Cars", mode: "image", x: 72, y: 150, scale: 1, delay: 0.1, exit: false };
          let v = {};
          try { v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {}; } catch (e) {}
          const P = Object.assign({}, DEF, v);
          const root = document.getElementById(ID);
          const box = root.querySelector(".lh-box");
          Object.assign(box.style, { left: P.x + "px", top: P.y + "px", zoom: String(P.scale) });
          if (P.mode === "text") box.classList.add("is-text");
          const dealer = root.querySelector(".lh-dealer");
          dealer.textContent = P.dealer;
          if (!String(P.dealer).trim()) dealer.remove();

          const tl = gsap.timeline({ paused: true });
          const t0 = Number(P.delay);
          tl.fromTo(box, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, t0);
          if (dealer.isConnected) tl.fromTo(dealer, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t0 + 0.08);
          if (P.exit) tl.to(box, { opacity: 0, duration: 0.2, ease: "power2.in" }, Math.max(t0 + 0.6, D - 0.22));
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
