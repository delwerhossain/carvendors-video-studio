<!doctype html>
<!--
  caption-line  (CarVendors x B&F voiceover caption track, 1080x1920)

  Source Sans 3 SemiBold ~54 px white, max 2 lines, soft shadow, no boxes and no karaoke colours.
  Each chunk enters with an 8 px rise (180 ms); the spoken word is subtly brighter and heavier
  (opacity 0.86 -> 1 plus a 0.9 px white stroke, which adds weight without changing the layout).
  Mount ONE instance per video as the caption track, spanning the whole voiceover.

  Variables (host data-variable-values):
    chunks   string   JSON array, times in seconds relative to the host start:
                        [{"s":0.25,"e":1.4,"w":[["Looking",0.25],["for",0.55],...]}, ...]
                      "w" = [word, startTime]; a word stays active until the next word starts.
                      A chunk may give "text" instead of "w"; its words are then spread evenly s..e.
                      mount.py --words <tts .words.json> builds this for you.
    x        number   left edge of the caption column px                         72
    bottom   number   y of the caption baseline box bottom px (safe zone <= 1240) 1240
    maxW     number   column width px (2 lines max at 54 px ~ 28 chars/line)      828
    size     number   font px                                                    54
    align    enum     "left" | "center" (center = centre of the x..x+maxW column)  "left"

  Timing per chunk: in at s (180 ms, 8 px rise, power3.out); out at e (120 ms fade, ends at e).
  Word emphasis tweens 80 ms in / 140 ms out.

  Mount:
    python3 tools/mount.py add . caption-line captions --start 0 --dur 8 --track 6 --vars-file caps.json
    python3 tools/mount.py add . caption-line captions --start 0 --dur 30 --track 6 --words voice/s01.words.json
  Needs assets/fonts/SourceSans3-SemiBold.ttf.
-->
<html
  data-composition-variables='[
    {"id":"chunks","type":"string","label":"Chunks (JSON)","default":"[{\"s\":0.2,\"e\":1.6,\"text\":\"Caption line goes here\"}]"},
    {"id":"x","type":"number","label":"Left (px)","default":72,"min":0,"max":1000},
    {"id":"bottom","type":"number","label":"Bottom (px)","default":1240,"min":200,"max":1900},
    {"id":"maxW","type":"number","label":"Width (px)","default":828,"min":200,"max":1000},
    {"id":"size","type":"number","label":"Size (px)","default":54,"min":30,"max":80},
    {"id":"align","type":"enum","label":"Align","default":"left","options":[{"value":"left","label":"Left"},{"value":"center","label":"Centre"}]}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Source Sans 3"; src: url("../assets/fonts/SourceSans3-SemiBold.ttf") format("truetype"); font-weight: 600; font-style: normal; }
        #__ID__ { position: absolute; inset: 0; pointer-events: none; }
        #__ID__ .cl-chunk {
          position: absolute; left: 72px; bottom: 680px; width: 828px; box-sizing: border-box;
          font-family: "Source Sans 3", sans-serif; font-weight: 600; font-size: 54px; line-height: 1.18;
          color: #fff; text-align: left; text-wrap: balance;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: visible;
          opacity: 0;
        }
        #__ID__ .cl-w {
          --a: 0;
          opacity: calc(0.86 + 0.14 * var(--a));
          -webkit-text-stroke: calc(var(--a) * 0.9px) #fff;
          text-shadow: 0 2px 18px rgb(0 0 0 / 0.42), 0 1px 3px rgb(0 0 0 / 0.38);
        }
      </style>
      <div id="__ID__" data-composition-id="__ID__" data-width="1080" data-height="1920"></div>
      <script>
        (function () {
          const ID = "__ID__", D = __DUR__;
          const DEF = { chunks: '[{"s":0.2,"e":1.6,"text":"Caption line goes here"}]', x: 72, bottom: 1240, maxW: 828, size: 54, align: "left" };
          let v = {};
          try { v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {}; } catch (e) {}
          const P = Object.assign({}, DEF, v);
          let chunks = [];
          try { chunks = typeof P.chunks === "string" ? JSON.parse(P.chunks) : P.chunks; } catch (e) { chunks = []; }
          const root = document.getElementById(ID);
          const tl = gsap.timeline({ paused: true });
          chunks.forEach((c) => {
            const s = Number(c.s), e = Math.min(Number(c.e), D);
            let words = c.w;
            if (!words) {
              const parts = String(c.text || "").split(/\s+/).filter(Boolean);
              words = parts.map((w, i) => [w, s + ((e - s) * i) / Math.max(1, parts.length)]);
            }
            const el = document.createElement("div");
            el.className = "cl-chunk";
            Object.assign(el.style, { left: P.x + "px", width: P.maxW + "px", bottom: (1920 - P.bottom) + "px", fontSize: P.size + "px", textAlign: P.align === "center" ? "center" : "left" });
            const spans = words.map(([w], i) => {
              const sp = document.createElement("span");
              sp.className = "cl-w";
              sp.textContent = w;
              el.appendChild(sp);
              if (i < words.length - 1) el.appendChild(document.createTextNode(" "));
              return sp;
            });
            root.appendChild(el);
            tl.fromTo(el, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.18, ease: "power3.out" }, s);
            spans.forEach((sp, i) => {
              const ws = Number(words[i][1]);
              const we = i < words.length - 1 ? Number(words[i + 1][1]) : e - 0.12;
              tl.to(sp, { "--a": 1, duration: 0.08, ease: "power1.out" }, ws);
              if (we - ws > 0.1) tl.to(sp, { "--a": 0, duration: 0.14, ease: "power1.inOut" }, we);
            });
            tl.to(el, { opacity: 0, duration: 0.12, ease: "power1.in" }, Math.max(s + 0.2, e - 0.12));
          });
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
