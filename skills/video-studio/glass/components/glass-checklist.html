<!doctype html>
<!--
  glass-checklist  (CarVendors x B&F neutral glass checklist, 1080x1920)

  Same glass material as glass-card (backdrop blur 28px, saturate 1.15, white fill ~6%, 1.5px white
  border at 25%, radius 24px). 1-3 rows; each row = round check icon (white tick in a 2px white circle)
  + Source Sans 3 SemiBold white text. Rows stagger in, ticks draw on (stroke-dashoffset).

  Variables (host data-variable-values):
    items    string   rows separated by "|" (max 3, keep each short)  "Sporty|Reliable|Easy on the wallet"
    x, y     number   top-left of the card in canvas px                 72, 600
    size     number   row text px (44-52 recommended)                   48
    maxW     number   max card width px                                 828
    fill     number   white fill opacity 0.04-0.08                      0.06
    delay    number   entrance start, s after the host start             0.05
    stagger  number   seconds between rows                               0.12
    blurIn   boolean  ramp the backdrop blur 0 -> 28px on entry          true
    exit     boolean  200 ms fade out at the end of the slot             true

  Timing: card 280 ms (16 px rise + opacity + blur ramp, power3.out); row i starts at
  delay + 0.12 + i*stagger (260 ms, 14 px rise, power3.out); its tick draws 300 ms from +0.1 s.
  3 rows are fully in ~0.85 s after delay. Exit 200 ms (power2.in) ending 20 ms before the slot ends.

  Mount:
    python3 tools/mount.py add . glass-checklist list-1 --start 5 --dur 3 --track 2 \
      --vars '{"items":"Sporty|Reliable|Easy on the wallet","y":600}'
  Needs assets/fonts/SourceSans3-SemiBold.ttf. Same backdrop-root caveat as glass-card: never fade a
  parent of the card; this file animates the card element itself.
-->
<html
  data-composition-variables='[
    {"id":"items","type":"string","label":"Rows (separate with |)","default":"Sporty|Reliable|Easy on the wallet"},
    {"id":"x","type":"number","label":"Left (px)","default":72,"min":0,"max":1000},
    {"id":"y","type":"number","label":"Top (px)","default":600,"min":0,"max":1900},
    {"id":"size","type":"number","label":"Text size (px)","default":48,"min":30,"max":72},
    {"id":"maxW","type":"number","label":"Max width (px)","default":828,"min":200,"max":1000},
    {"id":"fill","type":"number","label":"White fill","default":0.06,"min":0,"max":0.2,"step":0.01},
    {"id":"delay","type":"number","label":"Entrance delay (s)","default":0.05,"min":0,"max":5,"step":0.05},
    {"id":"stagger","type":"number","label":"Row stagger (s)","default":0.12,"min":0,"max":1,"step":0.01},
    {"id":"blurIn","type":"boolean","label":"Blur ramps in","default":true},
    {"id":"exit","type":"boolean","label":"Exit at end","default":true}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Source Sans 3"; src: url("../assets/fonts/SourceSans3-SemiBold.ttf") format("truetype"); font-weight: 600; font-style: normal; }
        #__ID__ { position: absolute; inset: 0; pointer-events: none; }
        #__ID__ .gl-card {
          --gb: 28px; --gs: 1.15; --fill: 0.06;
          position: absolute; left: 72px; top: 600px; box-sizing: border-box;
          width: max-content; max-width: 828px;
          padding: 0.56em 1em 0.56em 0.62em;
          display: flex; flex-direction: column; gap: 0.36em;
          border-radius: 24px;
          background: linear-gradient(180deg, rgb(255 255 255 / calc(var(--fill) + 0.02)), rgb(255 255 255 / calc(var(--fill) - 0.02)));
          border: 1.5px solid rgb(255 255 255 / 0.25);
          box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.14);
          -webkit-backdrop-filter: blur(var(--gb)) saturate(var(--gs));
          backdrop-filter: blur(var(--gb)) saturate(var(--gs));
          font-family: "Source Sans 3", sans-serif; font-weight: 600; font-size: 48px; line-height: 1.16;
          color: #fff;
          opacity: 0;
        }
        #__ID__ .gl-row { display: flex; align-items: center; gap: 0.46em; }
        #__ID__ .gl-ico { display: block; flex: none; width: 1.08em; height: 1.08em; overflow: visible; filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.14)); }
        #__ID__ .gl-ico circle { fill: rgb(255 255 255 / 0.08); stroke: #fff; stroke-width: 2; }
        #__ID__ .gl-ico path { fill: none; stroke: #fff; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
        #__ID__ .gl-txt { display: block; white-space: nowrap; text-shadow: 0 1px 2px rgb(0 0 0 / 0.16); }
      </style>
      <div id="__ID__" data-composition-id="__ID__" data-width="1080" data-height="1920">
        <div class="gl-card"></div>
      </div>
      <script>
        (function () {
          const ID = "__ID__", D = __DUR__;
          const DEF = { items: "Sporty|Reliable|Easy on the wallet", x: 72, y: 600, size: 48, maxW: 828, fill: 0.06, delay: 0.05, stagger: 0.12, blurIn: true, exit: true };
          let v = {};
          try { v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {}; } catch (e) {}
          const P = Object.assign({}, DEF, v);
          const root = document.getElementById(ID);
          const card = root.querySelector(".gl-card");
          Object.assign(card.style, { left: P.x + "px", top: P.y + "px", maxWidth: P.maxW + "px", fontSize: P.size + "px" });
          card.style.setProperty("--fill", String(P.fill));
          const NS = "http://www.w3.org/2000/svg";
          const items = String(P.items).split("|").map((s) => s.trim()).filter(Boolean).slice(0, 3);
          const rows = items.map((label) => {
            const row = document.createElement("div");
            row.className = "gl-row";
            const svg = document.createElementNS(NS, "svg");
            svg.setAttribute("class", "gl-ico");
            svg.setAttribute("viewBox", "0 0 52 52");
            const c = document.createElementNS(NS, "circle");
            c.setAttribute("cx", "26"); c.setAttribute("cy", "26"); c.setAttribute("r", "24");
            const pth = document.createElementNS(NS, "path");
            pth.setAttribute("d", "M15.5 26.8 L22.6 33.6 L36.8 19");
            pth.setAttribute("pathLength", "1");
            svg.append(c, pth);
            const t = document.createElement("span");
            t.className = "gl-txt";
            t.textContent = label;
            row.append(svg, t);
            card.appendChild(row);
            return { row, svg, pth };
          });

          const tl = gsap.timeline({ paused: true });
          const t0 = Number(P.delay), st = Number(P.stagger);
          tl.fromTo(card,
            { opacity: 0, y: 16, "--gb": P.blurIn ? "0px" : "28px", "--gs": P.blurIn ? 1 : 1.15 },
            { opacity: 1, y: 0, "--gb": "28px", "--gs": 1.15, duration: 0.28, ease: "power3.out" }, t0);
          rows.forEach((r, i) => {
            const at = t0 + 0.12 + i * st;
            tl.fromTo(r.row, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" }, at);
            tl.fromTo(r.svg, { scale: 0.86, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "power3.out" }, at);
            tl.fromTo(r.pth, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, at + 0.1);
          });
          if (P.exit) {
            const last = t0 + 0.12 + (rows.length - 1) * st + 0.4;
            tl.to(card, { opacity: 0, y: -8, duration: 0.2, ease: "power2.in" }, Math.max(last, D - 0.22));
          }
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
